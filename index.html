<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>arc.sys</title>
<link rel="apple-touch-icon" href="logo.png">
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root{
    --bg:#f5f5f3;
    --border:#d4d4d0;
    --border-soft:#e3e3e0;
    --text:#1c1c1c;
    --dim:#8a8a86;
    --accent:#2fa84f;
    --track:#e9e9e6;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);}
  body{
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh; /* better mobile viewport handling */
    padding:10px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; /* <-- vertical centering, was missing */
    font-size:13px;
  }
  .wrap{ width:100%; max-width:640px; }

  .topbar{
    display:flex; flex-direction:column; align-items:center;
    padding:2px 4px 22px;
    text-align:center;
  }
  .topbar .label{
    color:var(--dim); font-size:10.5px;
    letter-spacing:0.12em; text-transform:uppercase;
    margin-bottom:6px;
  }
  .topbar .clock{
    font-variant-numeric:tabular-nums;
    font-weight:300;
    font-size:34px;
    letter-spacing:0.02em;
    color:var(--text);
  }

  .viz-btn{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--dim);
    background:none;
    border:none;
    border-bottom:1px solid var(--border);
    padding:2px 0 4px;
    margin-top:10px;
    cursor:pointer;
    transition:color .15s linear, border-color .15s linear;
  }
  .viz-btn:hover{ color:var(--text); border-color:var(--text); }
  .viz-btn.active{ color:var(--accent); border-color:var(--accent); }

  .tablewrap{
    background:#ffffff;
    border:1px solid var(--border);
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }

  .grid-row{
    display:grid;
    grid-template-columns: 20px 1.15fr 1.85fr 78px;
    gap:0;
    align-items:center;
    min-width:340px;
    padding:0 8px;
  }

  .thead{
    color:var(--dim); font-size:10.5px;
    padding-top:8px; padding-bottom:8px;
    border-bottom:1px solid var(--border);
  }
  .thead span{
    border-right:1px solid var(--border);
    padding-right:8px;
  }
  .thead span:last-child{ border-right:none; text-align:right; padding-right:2px; }
  .thead span:not(:first-child){ padding-left:8px; }

  .row{
    padding-top:9px; padding-bottom:9px;
    border-bottom:1px solid var(--border-soft);
  }
  .row:last-child{ border-bottom:none; }
  .row > *:not(:first-child){ padding-left:8px; }

  .idx{ color:var(--dim); font-size:11px; }
  .fname{
    color:var(--text); font-size:12px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .barwrap{
    height:21px; background:var(--track);
    border:1px solid var(--border);
    overflow:hidden; position:relative;
  }
  .barfill{
    /* flush to the left edge, no border/shadow artifacts at 0 width */
    position:absolute;
    top:0; left:0; bottom:0;
    background:var(--accent);
    width:0%;
    border:none;
    box-shadow:none;
    transition:width .3s linear;
  }
  .barlabel{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; letter-spacing:0.02em;
    color:var(--text);
    text-shadow: 0 1px 1px rgba(255,255,255,0.6);
    white-space:nowrap;
  }

  .downloaded{
    text-align:right; font-size:11px; color:var(--dim);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .downloaded b{ color:var(--text); font-weight:600; }

  @media (min-width:601px){
    body{ font-size:14px; padding:24px; }
    .grid-row{ grid-template-columns: 24px 1.15fr 1.85fr 110px; }
    .barwrap{ height:24px; }
    .topbar .clock{ font-size:42px; }
  }
  @media (prefers-reduced-motion: reduce){
    .barfill{ transition:none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <span class="label">arc.sys</span>
    <span class="clock" id="uptime">0d 00:00:00</span>
    <button class="viz-btn" id="viz-btn">Visualize</button>
  </div>

  <div class="tablewrap">
    <div class="grid-row thead">
      <span>#</span><span>Name</span><span>Status</span><span>Downloaded</span>
    </div>

    <div class="grid-row row">
      <span class="idx">1</span>
      <span class="fname">shredd.pkg</span>
      <div class="barwrap"><div class="barfill" id="kcal-bar"></div><div class="barlabel" id="kcal-status">Downloading</div></div>
      <span class="downloaded"><b id="kcal-num">0</b> kg</span>
    </div>

    <div class="grid-row row">
      <span class="idx">2</span>
      <span class="fname">skills.pwn</span>
      <div class="barwrap"><div class="barfill" id="hack-bar"></div><div class="barlabel" id="hack-status">Downloading</div></div>
      <span class="downloaded"><b id="hack-num">0:00</b> hrs</span>
    </div>

    <div class="grid-row row">
      <span class="idx">3</span>
      <span class="fname">posted.vid</span>
      <div class="barwrap"><div class="barfill" id="soc-bar"></div><div class="barlabel" id="soc-status">Downloading</div></div>
      <span class="downloaded"><b id="soc-num">0</b></span>
    </div>

    <div class="grid-row row">
      <span class="idx">4</span>
      <span class="fname">vocab.dic</span>
      <div class="barwrap"><div class="barfill" id="voc-bar"></div><div class="barlabel" id="voc-status">Downloading</div></div>
      <span class="downloaded"><b id="voc-num">0</b></span>
    </div>

    <div class="grid-row row">
      <span class="idx">5</span>
      <span class="fname">clean.sys</span>
      <div class="barwrap"><div class="barfill" style="width:100%"></div><div class="barlabel">Seeding</div></div>
      <span class="downloaded" id="fw-num">0d 00:00:00</span>
    </div>

  </div>
</div>

<script>
(function(){
  const START = new Date('2026-09-15T00:00:00');

  // shredd.pkg -- weight goal: 72.45kg -> 61kg, Sep 15 00:00 to Dec 1 23:59
  // (stays continuous through the day, unlike the three below)
  // This end date is the single source of truth for the arc's true length
  // (~78 days) -- everything else derives from it so nothing finishes early.
  const WT_START = 72.45;
  const WT_END   = 61;
  const WT_END_DATE = new Date('2026-12-02T00:00:00');
  const WT_SECONDS = (WT_END_DATE - START)/1000;
  const ARC_SECONDS = WT_SECONDS;
  const ARC_DAYS = Math.ceil(ARC_SECONDS/86400); // 78

  // skills.pwn -- +2 hrs/day, credited only once the day completes
  const SKILL_HOURS_PER_DAY = 2;
  const SKILL_TOTAL = SKILL_HOURS_PER_DAY*ARC_DAYS;

  // posted.vid -- +30 videos/day, credited only once the day completes
  const POST_PER_DAY = 30;
  const POST_TOTAL = POST_PER_DAY*ARC_DAYS;

  // vocab.dic -- +3360 words/day, credited only once the day completes
  const VOC_PER_DAY = 3360;
  const VOC_TOTAL = VOC_PER_DAY*ARC_DAYS;

  function pad(n){ return String(n).padStart(2,'0'); }
  function fmtInt(n){ return Math.floor(n).toLocaleString('en-US'); }
  function fmtHours(n){
    const hh = Math.floor(n);
    const mm = Math.floor((n-hh)*60);
    return `${hh}:${pad(mm)}`;
  }

  function setRow(prefix, val, total, fmt){
    fmt = fmt || fmtInt;
    document.getElementById(prefix+'-num').textContent = fmt(val);
    const pct = Math.min(val/total*100, 100);
    document.getElementById(prefix+'-bar').style.width = pct + '%';
    const statusEl = document.getElementById(prefix+'-status');
    statusEl.textContent = pct >= 100 ? 'Seeding' : `Downloading  ${pct.toFixed(1)}%`;
  }

  function setWeightRow(elapsedSec){
    const frac = Math.min(elapsedSec/WT_SECONDS, 1);
    const current = WT_START - (WT_START-WT_END)*frac;
    document.getElementById('kcal-num').textContent = current.toFixed(2);
    const pct = frac*100;
    document.getElementById('kcal-bar').style.width = pct + '%';
    const statusEl = document.getElementById('kcal-status');
    statusEl.textContent = pct >= 100 ? 'Seeding' : `Downloading  ${pct.toFixed(1)}%`;
  }

  // --- VISUALIZE MODE ---
  // Compresses the full arc into VIZ_DURATION_SEC of real time so
  // every bar sweeps 0% -> 100%. Runs once and freezes at 100% (no loop)
  // until the button is pressed again to reset back to real time.
  let vizMode = false;
  let vizStartReal = 0;
  const VIZ_DURATION_SEC = 20;

  const vizBtn = document.getElementById('viz-btn');
  vizBtn.addEventListener('click', function(){
    vizMode = !vizMode;
    if (vizMode){
      vizStartReal = performance.now();
      vizBtn.textContent = 'Reset';
      vizBtn.classList.add('active');
    } else {
      vizBtn.textContent = 'Visualize';
      vizBtn.classList.remove('active');
    }
  });

  function tick(){
    const now = new Date();
    let elapsedSec;

    if (vizMode){
      const realElapsed = (performance.now() - vizStartReal)/1000;
      const frac = Math.min(realElapsed/VIZ_DURATION_SEC, 1);
      elapsedSec = frac * ARC_SECONDS; // freezes at ARC_SECONDS once frac hits 1
    } else {
      elapsedSec = Math.max(0,(now - START)/1000);
    }

    const d = Math.floor(elapsedSec/86400);
    const h = Math.floor((elapsedSec%86400)/3600);
    const m = Math.floor((elapsedSec%3600)/60);
    const s = Math.floor(elapsedSec%60);
    const uptimeStr = `${d}d ${pad(h)}:${pad(m)}:${pad(s)}`;
    document.getElementById('uptime').textContent = uptimeStr;
    document.getElementById('fw-num').textContent = uptimeStr;

    // d = number of FULLY completed 86400s days; these three only step up
    // once a day finishes. The arc's last day is only 23:59 long though
    // (ends at Dec 1 23:59, not midnight), so it would never floor() up
    // to a full day -- credit it as complete once the arc itself ends.
    const completedDays = elapsedSec >= ARC_SECONDS ? ARC_DAYS : Math.min(d, ARC_DAYS);

    setWeightRow(elapsedSec);
    setRow('hack', completedDays*SKILL_HOURS_PER_DAY, SKILL_TOTAL, fmtHours);
    setRow('soc',  completedDays*POST_PER_DAY,  POST_TOTAL);
    setRow('voc',  completedDays*VOC_PER_DAY,   VOC_TOTAL);
  }

  tick();
  setInterval(tick, 250);
})();
</script>
</body>
</html>
